[project]
name = "solscore-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pymysql",
    "pydantic-settings",
    "PyJWT[crypto]",
    "httpx",
    "orjson",
    "alembic",
    "python-multipart",
    "openpyxl",
    "xlrd",
]

[project.optional-dependencies]
dev = ["pytest"]
